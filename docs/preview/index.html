<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>DirectHomes | Private preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1e3d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  form{background:#fff;padding:32px 28px;border-radius:14px;width:320px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
  h1{font-size:20px;margin:0 0 4px;color:#1F3A6E} p{font-size:13px;color:#556;margin:0 0 18px}
  label{position:absolute;left:-9999px}
  input{width:100%;box-sizing:border-box;padding:11px 12px;margin:6px 0;border:1px solid #cdd5e0;border-radius:8px;font-size:16px}
  button{width:100%;padding:12px;margin-top:10px;background:#1F3A6E;color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait} #e{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<form id="f">
  <h1>DirectHomes</h1>
  <p>Private preview. Sign in to open the app prototype.</p>
  <label for="u">Username</label><input id="u" placeholder="Username" autocomplete="username" autocapitalize="none" required />
  <label for="p">Password</label><input id="p" type="password" placeholder="Password" autocomplete="current-password" required />
  <div id="e" role="alert"></div>
  <button id="b">Enter</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('b').disabled = true; $('e').textContent = '';
  try {
    const buf = new Uint8Array(await (await fetch('prototype.bin')).arrayBuffer());
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode($('u').value.trim().toLowerCase() + ':' + $('p').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data));
    document.open(); document.write(html); document.close();
  } catch (e) {
    $('e').textContent = 'Incorrect username or password';
    $('b').disabled = false;
  }
});
</script>
</body>
</html>
